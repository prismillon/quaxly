name: "PR image build"

on:
  pull_request:
    branches:
      - "main"
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: "pr-image-build-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: "Build image (no push)"
    # Public repos + self-hosted runners: never run fork PR code on our runners.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, neptune, docker]
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: "app/pr-check:pr-${{ github.event.pull_request.number }}"
          cache-from: type=gha

      # Loads every cog, checks the SQLAlchemy driver against a real Postgres,
      # and optionally opens a Discord gateway connection. The gateway check is
      # skipped when DISCORD_DEV_TOKEN is not set.
      - name: Smoke test image
        if: steps.build.outcome == 'success'
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_DEV_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_TOKEN}" ]; then
            echo "::warning::DISCORD_DEV_TOKEN is not set; skipping the Discord gateway check."
          fi

          suffix="${{ github.run_id }}-${{ github.run_attempt }}"
          network="quaxly-smoke-net-${suffix}"
          redis="quaxly-smoke-redis-${suffix}"
          db="quaxly-smoke-db-${suffix}"
          app="quaxly-smoke-app-${suffix}"
          cleanup() {
            docker rm -f "${app}" >/dev/null 2>&1 || true
            docker rm -f "${db}" >/dev/null 2>&1 || true
            docker rm -f "${redis}" >/dev/null 2>&1 || true
            docker network rm "${network}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          # cogs/war talks to Redis while the cog is constructed, and the DB
          # check exercises the SQLAlchemy driver end to end. Give the smoke
          # test throwaway sidecars instead of production services.
          docker network create "${network}" >/dev/null
          docker run -d --rm --name "${redis}" --network "${network}" \
            redis:8-alpine >/dev/null
          docker run -d --rm --name "${db}" --network "${network}" \
            -e POSTGRES_PASSWORD=postgres \
            postgres:17-alpine >/dev/null

          redis_ready=false
          for _ in $(seq 1 30); do
            if docker exec "${redis}" redis-cli ping 2>/dev/null | grep -q PONG; then
              redis_ready=true
              break
            fi
            sleep 1
          done
          if [ "${redis_ready}" != "true" ]; then
            echo "::error::Redis sidecar did not become ready"
            docker logs "${redis}" || true
            exit 1
          fi

          db_ready=false
          for _ in $(seq 1 30); do
            if docker exec "${db}" pg_isready -U postgres >/dev/null 2>&1; then
              db_ready=true
              break
            fi
            sleep 1
          done
          if [ "${db_ready}" != "true" ]; then
            echo "::error::Postgres sidecar did not become ready"
            docker logs "${db}" || true
            exit 1
          fi

          run() {
            if command -v timeout >/dev/null 2>&1; then
              timeout 180 "$@"
            else
              "$@"
            fi
          }

          run docker run --rm --name "${app}" --network "${network}" \
            -e DISCORD_TOKEN \
            -e REDIS_URL="${redis}" \
            -e SMOKE_DB_CHECK=1 \
            -e DATABASE_URL="postgresql://postgres:postgres@${db}:5432/postgres" \
            "app/pr-check:pr-${{ github.event.pull_request.number }}" \
            python smoke_test.py

      - name: Extract Renovate update table
        id: renovate
        if: always() && !cancelled() && (github.actor == 'renovate[bot]' || github.actor == 'renovate')
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          TABLE=$(printf '%s\n' "$BODY" | grep '^|' | grep -v '^|---|' | grep -v '| Package |' || true)
          CLEAN=$(printf '%s\n' "$TABLE" | sed -E 's/\[([^]]*)\]\([^)]*\)/\1/g; s/^\| //; s/ \|$//; s/ \| / · /g')
          {
            echo "table<<EOF"
            echo "$CLEAN"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Discord notification
        if: always() && !cancelled() && (github.actor == 'renovate[bot]' || github.actor == 'renovate')
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          status: ${{ job.status }}
          title: "${{ github.event.repository.name }} · image build ${{ job.status }} · PR #${{ github.event.pull_request.number }}"
          description: |
            **${{ github.event.pull_request.title }}**

            ${{ steps.renovate.outputs.table }}

            **Repository:** `${{ github.repository }}`
            **Build:** `${{ job.status }}`
            **Branch:** `${{ github.event.pull_request.head.ref }}`
          url: ${{ github.event.pull_request.html_url }}
          color: ${{ job.status == 'success' && '5763719' || (job.status == 'cancelled' && '16776960' || '15158332') }}
          username: "Renovate · ${{ github.event.repository.name }}"
